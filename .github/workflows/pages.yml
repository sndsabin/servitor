name: Deploy pages

on:
  push:
    branches:
      - master
    paths:
      - "docs/**"
  release:
    types:
      - published
  workflow_dispatch:

env:
  GH_TOKEN: ${{ github.token }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch latest release asset urls
        run: |
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
          https://api.github.com/repos/${{ github.repository }}/releases/latest \
          | jq '{
              version: .tag_name,
              windows: first(.assets[] | select(.name | ascii_downcase | endswith(".exe")) | .browser_download_url),
              linux: first(.assets[] | select(.name | ascii_downcase | endswith(".deb")) | .browser_download_url),
              mac: first(.assets[] | select(.name | ascii_downcase | endswith(".dmg")) | .browser_download_url)
            }' > ./docs/assets.json

          echo "Generated assets.json:"
          cat ./docs/assets.json

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy Pages
        uses: actions/deploy-pages@v5
